name: Validate Adventura

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/domain/classes.ts src/domain/classFeatures.ts && git diff -- src/domain/classes.ts src/domain/classFeatures.ts
      - run: npm run build
      - run: npm test
