name: Validate Adventura

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Diagnose Prettier output
        run: |
          npx prettier src/domain/spellCatalog.ts > /tmp/spellCatalog.ts
          diff -u src/domain/spellCatalog.ts /tmp/spellCatalog.ts || true
      - run: npm run format:check
      - run: npm run build
      - run: npm test
